[package]
name = "gptvoice-tauri"
version = "0.1.1"
description = "GPTVoice native desktop panel and Discord voice relay"
authors = ["mutedvector"]
license = "MIT"
repository = "https://github.com/mutedvector/gptvoice-discord"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "gptvoice_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend"] }
songbird = { version = "0.6.0", default-features = false, features = ["serenity", "rustls", "driver", "gateway", "tungstenite", "receive"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
symphonia-core = "0.5.2"
symphonia = { version = "0.5.2", default-features = false, features = ["pcm"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
